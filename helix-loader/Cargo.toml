[package]
include = ["src/**", "README.md", "LICENSE", "build.rs", "languages.toml", "runtime/queries/**", "runtime/themes/**", "runtime/tutor"]
name = "pure-editor-loader"
description = "Build bootstrapping for Helix crates"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "hx-loader"
path = "src/main.rs"

[dependencies]
helix-stdx = { version = "=0.1.0", package = "pure-editor-stdx", path = "../helix-stdx" }

anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
toml.workspace = true
etcetera.workspace = true
parking_lot.workspace = true
sha2 = "0.11"
globset.workspace = true
log = "0.4"

# TODO: these two should be on !wasm32 only

# cloning/compiling tree-sitter grammars
cc = { version = "1" }
threadpool = { version = "1.0" }
tempfile.workspace = true

tree-house.workspace = true

[lib]
name = "helix_loader"

[build-dependencies]
sha2 = "0.11"
