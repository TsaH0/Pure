[package]
name = "pure-editor-tui"
description = """A library to build rich terminal user interfaces or dashboards"""
include = ["src/**", "README.md", "LICENSE"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["termina", "crossterm"]

[dependencies]
helix-view = { version = "=0.1.0", package = "pure-editor-view", path = "../helix-view", features = ["term"] }
helix-core = { version = "=0.1.0", package = "pure-editor-core", path = "../helix-core" }

bitflags.workspace = true
cassowary = "0.3"
arrayvec.workspace = true
unicode-segmentation.workspace = true
termina = { workspace = true, optional = true }
termini = "1.0"
log = "~0.4"

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.28", optional = true }

[lib]
name = "helix_tui"
