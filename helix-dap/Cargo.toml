[package]
include = ["src/**", "README.md", "LICENSE"]
name = "pure-editor-dap"
description = "DAP client implementation for Helix project"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
helix-stdx = { version = "=0.1.0", package = "pure-editor-stdx", path = "../helix-stdx" }
helix-core = { version = "=0.1.0", package = "pure-editor-core", path = "../helix-core" }
helix-dap-types = { version = "=0.1.0", package = "pure-editor-dap-types", path = "../helix-dap-types" }

anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "io-std", "time", "process", "macros", "fs", "parking_lot", "net", "sync"] }
thiserror.workspace = true
slotmap.workspace = true
futures-executor.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
sonic-rs.workspace = true

[lib]
name = "helix_dap"
