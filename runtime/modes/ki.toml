"x+p" = ["extend_to_line_bounds", "extend_to_last_line", "yank", "delete_selection"]
"c+l" = ["extend_to_line_bounds", "extend_line_below", "yank", "collapse_selection"]
"c+k" = ["extend_to_line_bounds", "extend_line_below", "yank", "collapse_selection"]
"c+o" = ["extend_to_line_bounds", "extend_line_below", "yank", "collapse_selection"]
