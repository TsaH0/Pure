# Ki editor keys (https://github.com/ki-editor/ki-editor), Qwerty
# positions. As in Ki, first pick a selection mode, then the same keys move
# in it:
#   a LINE   s WORD   w SUBWORD   W CHAR   d NODE (syntax)   E PARAGRAPH
#   j/l left/right   u/o previous/next   i/k up/down   y/p first/last
# and act: f change, r delete, x cut, c copy, v paste, h/; insert before/
# after, z/Z undo/redo, I join, K break line, L/J indent/dedent, m jump,
# / and ? flip, Y/P align, F transform (case), , surround, n local menu
# (search, diagnostics, changes, quickfix), g o/O open line, q movement
# history, Enter save, Tab/Backspace through earlier selections, Alt-i/k
# scroll, Alt-; centre the view, Alt-/ next window.
#
# Ki's momentary layers are chords here: hold r (delete), x (cut) or c
# (copy) and press a movement to act along it, g (open) and q (history)
# with i/k and j/l. They need a terminal that reports key releases (kitty,
# WezTerm, foot, Ghostty...); elsewhere, and when tapped, r x c act on the
# selection. Turn on with `:mode ki`; each selection mode is a mode of its
# own (ki-line, ki-word...), shown in the statusline.
#
# Not here, because Pure has nothing to bind them to: Ki's multi-cursor (b)
# and swap (t) layers, M (go to index), . (parent line), the buffer layer
# (e), Shift-Enter (save as), * (keyboard layouts: this file is Qwerty).

[modes.ki]
description = "Ki editor keys: selection modes (a s w W d E), movements (j l u o i k y p), actions, and Ki's held layers as chords"
lighter = "Ki"
global = true
conflicts = ["vim", "emacs"]
on-enable = ["normal_mode", ":mode ki-word on"]

[modes.ki.keys.normal]
a = ":mode ki-line on"
s = ":mode ki-word on"
w = ":mode ki-subword on"
W = ":mode ki-char on"
d = ":mode ki-node on"
E = ":mode ki-paragraph on"
A = ["extend_to_line_bounds", ":mode ki-line on"]
D = ["expand_selection", ":mode ki-node on"]
S = ["move_next_long_word_start", ":mode ki-word on"]
f = "change_selection"
r = "delete_selection"
x = ["yank", "delete_selection"]
c = "yank"
v = "paste_after"
h = "insert_mode"
";" = "append_mode"
z = "undo"
Z = "redo"
I = "join_selections"
K = ["append_mode", "insert_newline", "normal_mode"]
L = "indent"
J = "unindent"
m = "goto_word"
"/" = "flip_selections"
"?" = "flip_selections"
Y = "align_selections"
P = "align_selections"
"," = "surround_add"
ret = ":write"
tab = "jump_forward"
backspace = "jump_backward"
"A-i" = "half_page_up"
"A-k" = "half_page_down"
"A-;" = "align_view_center"
"A-/" = "rotate_view"
"C-z" = "suspend"

[modes.ki.keys.normal.F]
u = "switch_to_uppercase"
l = "switch_to_lowercase"
c = "switch_case"

[modes.ki.keys.normal.n]
n = "search_next"
N = "search_prev"
"/" = "search"
d = "goto_next_diag"
D = "goto_prev_diag"
g = "goto_next_change"
G = "goto_prev_change"
q = "quickfix_next"
Q = "quickfix_prev"
s = "symbol_picker"

[modes.ki.keys.normal.g]
k = "open_below"
i = "open_above"
o = "open_below"
O = "open_above"

[modes.ki.keys.normal.q]
j = "jump_backward"
l = "jump_forward"

[modes.ki.chords.normal]
"g+k" = "open_below"
"g+i" = "open_above"
"q+j" = "jump_backward"
"q+l" = "jump_forward"
"z+j" = "undo"
"z+l" = "redo"

