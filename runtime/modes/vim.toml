# Vim keys on Pure. Turn on with `:mode vim` (off: `:mode vim off`).
# Copy to ~/.config/pure/modes/ and edit: your copy wins over this one.
#
# Motions move the cursor as Vim's do (they don't leave a selection), and
# every operator (d c y gu gU g~ > < =) takes every motion and text object:
# dw, d3w, dt), ci", da(, yi{, gUiw, >j, d%, dG, dgg... Counts work.
#
# Not here, because Pure has nothing to bind them to:
#   Ctrl-v block selection, R replace mode, U line undo, gv reselect,
#   m{a-z} / '{a-z} / `{a-z} marks, Ctrl-o in insert mode, Ctrl-a/x on
#   words (Ctrl-a/x work on numbers), :g//, and . repeats Pure's last
#   insert rather than any change.
# Different from Vim:
#   , has no reverse find (; repeats the last one); / ? n N select the match;
#   q toggles recording into the @ register ("aq records into a), @ then a
#   register replays it.

[modes.vim]
description = "Vim keys: motions, operators with every motion and text object, visual and line modes, Vim's insert keys"
lighter = "Vim"
global = true
conflicts = ["emacs", "ki"]
on-enable = ["normal_mode", "collapse_selection"]

[modes.vim.keys.normal]
w = "vim_next_word_start"
W = "vim_next_long_word_start"
e = "vim_next_word_end"
E = "vim_next_long_word_end"
b = "vim_prev_word_start"
B = "vim_prev_long_word_start"
"0" = "goto_line_start"
"^" = "goto_first_nonwhitespace"
"$" = "goto_line_end"
G = "goto_last_line"
H = "goto_window_top"
M = "goto_window_center"
L = "goto_window_bottom"
"%" = "match_brackets"
"}" = ["goto_next_paragraph", "collapse_selection"]
"{" = ["goto_prev_paragraph", "flip_selections", "collapse_selection"]
f = ["find_next_char", "collapse_selection"]
t = ["find_till_char", "collapse_selection"]
F = ["find_prev_char", "collapse_selection"]
T = ["till_prev_char", "collapse_selection"]
";" = ["repeat_last_motion", "collapse_selection"]
"*" = ["select_textobject_inner", "@w", "search_selection_detect_word_boundaries", "search_next", "flip_selections", "collapse_selection"]
"#" = ["select_textobject_inner", "@w", "search_selection_detect_word_boundaries", "search_prev", "flip_selections", "collapse_selection"]
n = ["search_next", "flip_selections", "collapse_selection"]
N = ["search_prev", "flip_selections", "collapse_selection"]
x = "delete_selection"
X = ["move_char_left", "delete_selection"]
s = "change_selection"
S = ["goto_first_nonwhitespace", "extend_to_line_end", "change_selection"]
D = ["extend_to_line_end", "delete_selection"]
C = ["extend_to_line_end", "change_selection"]
Y = ["extend_to_line_bounds", "yank", "collapse_selection"]
"~" = ["switch_case", "move_char_right"]
J = ["extend_line_below", "join_selections", "collapse_selection"]
v = "select_mode"
V = ["extend_to_line_bounds", "select_mode"]
K = "hover"
q = "record_macro"
"@" = ["select_register", "replay_macro"]
"C-r" = "redo"
"C-e" = "scroll_down"
"C-y" = "scroll_up"
"C-a" = "increment"
