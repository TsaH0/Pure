[package]
name = "pure-editor"
description = "Pure: a Helix-derived terminal editor with WebAssembly plugins"
include = ["src/**", "README.md", "LICENSE", "build.rs", "assets/**"]
default-run = "pure"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.deb]
# generate a .deb in target/debian/ with the command: cargo deb --no-build
name = "helix"
assets = [
  { source = "target/release/pure", dest = "/usr/lib/helix/", mode = "755" },
  { source = "../contrib/hx_launcher.sh", dest = "/usr/bin/pure", mode = "755" },
  { source = "../runtime/*", dest = "/usr/lib/helix/runtime/", mode = "644" },
  { source = "../runtime/grammars/*", dest = "/usr/lib/helix/runtime/grammars/", mode = "644" }, # to avoid sources/
  { source = "../runtime/queries/**/*", dest = "/usr/lib/helix/runtime/queries/", mode = "644" },
  { source = "../runtime/themes/**/*", dest = "/usr/lib/helix/runtime/themes/", mode = "644" },
  { source = "../README.md", dest = "/usr/share/doc/helix/", mode = "644" },
  { source = "../contrib/completion/hx.bash", dest = "/usr/share/bash-completion/completions/hx", mode = "644" },
  { source = "../contrib/completion/hx.fish", dest = "/usr/share/fish/vendor_completions.d/hx.fish", mode = "644" },
  { source = "../contrib/completion/hx.zsh", dest = "/usr/share/zsh/vendor-completions/_hx", mode = "644" },
  { source = "../contrib/Helix.desktop", dest = "/usr/share/applications/Helix.desktop", mode = "644" },
  { source = "../contrib/helix.png", dest = "/usr/share/icons/hicolor/256x256/apps/helix.png", mode = "644" },
]

[features]
# Optional network-heavy parser setup; otherwise run pure --grammar fetch/build.
build-grammars = []
default = ["git", "plugins"]
unicode-lines = ["helix-core/unicode-lines", "helix-view/unicode-lines"]
integration = ["helix-event/integration_test"]
git = ["helix-vcs/git"]
# WebAssembly plugins (Wasmtime). Without it Pure has no plugin support.
plugins = ["dep:helix-plugin", "dep:sha2", "dep:trash"]

[[bin]]
name = "pure"
path = "src/main.rs"

[dependencies]
slotmap.workspace = true
helix-stdx = { version = "=0.1.0", package = "pure-editor-stdx", path = "../helix-stdx" }
helix-core = { version = "=0.1.0", package = "pure-editor-core", path = "../helix-core" }
helix-event = { version = "=0.1.0", package = "pure-editor-event", path = "../helix-event" }
helix-view = { version = "=0.1.0", package = "pure-editor-view", path = "../helix-view" }
helix-lsp = { version = "=0.1.0", package = "pure-editor-lsp", path = "../helix-lsp" }
helix-dap = { version = "=0.1.0", package = "pure-editor-dap", path = "../helix-dap" }
helix-vcs = { version = "=0.1.0", package = "pure-editor-vcs", path = "../helix-vcs" }
helix-loader = { version = "=0.1.0", package = "pure-editor-loader", path = "../helix-loader" }
helix-plugin = { version = "=0.1.0", package = "pure-editor-plugin", path = "../helix-plugin", optional = true }
sha2 = { version = "0.11", optional = true }

anyhow = "1"

tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "net", "sync", "io-std", "time", "process", "macros", "fs", "parking_lot"] }
tui = { version = "=0.1.0", path = "../helix-tui", package = "pure-editor-tui", default-features = false, features = ["termina", "crossterm"] }
termina = { workspace = true, features = ["event-stream"] }
signal-hook = "0.4"
tokio-stream = "0.1"
futures-util = { version = "0.3", features = ["std", "async-await"], default-features = false }
arc-swap.workspace = true
termini = "1"
indexmap = { version = "2.14", features = ["serde"] }

# Logging
log = { version = "0.4", features = ["std"] }

# File picker
nucleo.workspace = true
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
# markdown doc rendering
pulldown-cmark = { version = "0.13", default-features = false }
thiserror.workspace = true

# opening URLs
open = "5.3.5"

# config
toml.workspace = true

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

dashmap = "6.2"

parking_lot.workspace = true
trash = { version = "5.2.9", default-features = false, optional = true }
notify = "8"

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.28", features = ["event-stream"] }

[target.'cfg(not(windows))'.dependencies]  # https://github.com/vorner/signal-hook/issues/100
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
libc = "0.2.186"

[build-dependencies]
helix-loader = { version = "=0.1.0", package = "pure-editor-loader", path = "../helix-loader" }

[dev-dependencies]
smallvec = "1.15"
indoc = "2.0.6"
tempfile.workspace = true
same-file = "1.0.1"

[lib]
name = "helix_term"
