[package]
include = ["src/**", "README.md", "LICENSE"]
name = "pure-editor-vcs"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
helix-core = { version = "=0.1.0", package = "pure-editor-core", path = "../helix-core" }
helix-event = { version = "=0.1.0", package = "pure-editor-event", path = "../helix-event" }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "parking_lot", "macros"] }
parking_lot.workspace = true
arc-swap.workspace = true

gix = { version = "0.85.0", features = ["attributes", "status", "max-performance", "sha1"], default-features = false, optional = true }
imara-diff =  "0.2.0"
anyhow = "1"

log = "0.4"

[features]
git = ["gix"]

[dev-dependencies]
tempfile.workspace = true

[lib]
name = "helix_vcs"
