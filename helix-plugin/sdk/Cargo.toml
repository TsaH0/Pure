[package]
name = "helix-plugin-api"
description = "SDK for writing Helix plugins in Rust"
version = "0.5.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[features]
# Preserve the original component ABI for existing plugins.
api-v0-1 = []
api-v0-2 = []
api-v0-3 = []
api-v0-4 = []

[dependencies]
wit-bindgen = "0.60"

# Not part of the editor's workspace: plugins are built for wasm32-wasip2.
[workspace]
