name = "outline"
version = "0.1.0"
api = "0.5"
description = "The current file's symbols in a panel, following the cursor, like aerial.nvim"
permissions = ["read-buffers", "edit-buffers"]
wasm = "plugin.wasm"

# Default binding: only used where nothing else binds the key.
[keys.normal.space]
O = "toggle"
