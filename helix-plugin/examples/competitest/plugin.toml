name = "competitest"
version = "0.1.0"
api = "0.4"
description = "Run a competitive programming solution against its testcases, like competitest.nvim"
permissions = ["read-buffers", "open-files", "process", "filesystem", "listen"]
wasm = "plugin.wasm"

# Default bindings: only used where nothing else binds the key.
[keys.normal.space.u]
r = "run"
a = "add"
p = "panel"
t = "receive"
