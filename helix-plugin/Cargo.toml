[package]
name = "helix-plugin"
description = "WebAssembly plugin host for Helix"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
helix-core = { path = "../helix-core" }

anyhow = "1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml.workspace = true
wasmtime = { version = "41.0.4", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "41.0.4", default-features = false, features = ["p2"] }

[dev-dependencies]
quickcheck.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
