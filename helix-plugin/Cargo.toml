[package]
include = ["src/**", "README.md", "LICENSE", "wit/**"]
name = "pure-editor-plugin"
description = "WebAssembly plugin host for Helix"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
helix-core = { version = "=0.1.0", package = "pure-editor-core", path = "../helix-core" }

anyhow = "1"
globset.workspace = true
log = "0.4"
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
toml.workspace = true
wasmtime = { version = "41.0.4", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation", "async"] }
wasmtime-wasi = { version = "41.0.4", default-features = false, features = ["p2"] }

tokio = { version = "1", features = ["rt", "time", "net", "sync"] }

[dev-dependencies]
quickcheck.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lib]
name = "helix_plugin"
